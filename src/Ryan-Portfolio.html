    :root {
      color-scheme: light dark;
      --bg: #070d1b;
      --bg-rgb: 7, 13, 27;
      --ink: #f1ead9;
      --muted: #b9b4aa;
      --line: rgba(206, 166, 80, .5);
      --accent: #cea650;
      --accent-soft: rgba(206, 166, 80, .15);
      --green: #91a99a;
      --surface: #101a2c;
      --surface-2: #17233a;
      --cloud-base: 7, 13, 27;
      --cloud-peak: 24, 37, 62;
      --display: "Alagard", "Pixelify Sans", ui-monospace, monospace;
      --mono: "Pixelify Sans", ui-monospace, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #030713;
        --bg-rgb: 3, 7, 19;
        --ink: #f4eddd;
        --muted: #beb9af;
        --line: rgba(218, 181, 95, .52);
        --accent: #dab55f;
        --accent-soft: rgba(218, 181, 95, .15);
        --green: #94aa9d;
        --surface: #0b1426;
        --surface-2: #132039;
        --cloud-base: 3, 7, 19;
        --cloud-peak: 19, 33, 58;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      line-height: 1.55;
    }
    body.panel-open { overflow: hidden; }
    ::selection { background: var(--accent); color: #fff; }
    a, button { color: inherit; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }

    #pixel-field {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 0 72%, rgba(var(--bg-rgb), .2));
    }
    .shell { position: relative; z-index: 2; width: min(1220px, calc(100% - 48px)); margin: 0 auto; }

    .hero {
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--line);
    }
    .hero-top {
      display: grid;
      grid-template-columns: minmax(220px, 470px) 1fr auto;
      gap: 40px;
      align-items: start;
      font-size: 12px;
    }
    .hero-intro { margin: 0; color: var(--muted); }
    .hero-intro strong { color: var(--ink); font-weight: 500; }
    .hero-meta { color: var(--muted); }
    .hero-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px 20px; }
    .hero a { text-decoration: none; border-bottom: 1px solid var(--line); }
    .hero a:hover, .hero a:focus-visible { color: var(--accent); outline: none; border-color: var(--accent); }
    .hero-name { margin-top: auto; padding-top: 80px; }
    .hero h1 {
      margin: 0 0 -0.095em -0.012em;
      max-width: none;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(90px, 20.1vw, 292px);
      line-height: .63;
      letter-spacing: -.035em;
      white-space: nowrap;
    }
    .hero h1 span { display: block; color: var(--accent); margin-left: .46em; }
    .scroll-mark {
      position: absolute;
      right: 0;
      bottom: 32px;
      color: var(--muted);
      font-size: 10px;
      writing-mode: vertical-rl;
    }

    .content-section { padding: 120px 0 135px; border-bottom: 1px solid var(--line); }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 68px;
    }
    .section-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(53px, 8vw, 102px);
      line-height: .82;
      font-weight: 400;
    }
    .section-head span { color: var(--muted); font-size: 11px; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      border-top: 1px solid var(--line);
    }
    .project {
      grid-column: span 6;
      min-height: 305px;
      padding: 30px 30px 27px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .project:nth-child(odd) { border-right: 1px solid var(--line); }
    .project:nth-child(even) { padding-left: 30px; }
    .project-index { color: var(--accent); font-size: 11px; }
    .project-title {
      display: block;
      max-width: 560px;
      font-family: var(--display);
      font-size: clamp(39px, 5vw, 68px);
      line-height: .82;
      margin: 28px 0;
    }
    .project-foot { display: flex; justify-content: space-between; gap: 25px; align-items: end; }
    .project-proof { max-width: 430px; color: var(--muted); font-size: 12px; }
    .project-arrow { font-size: 22px; transition: transform .15s ease; }
    .project:hover, .project:focus-visible { background: var(--accent-soft); outline: none; }
    .project:hover .project-arrow, .project:focus-visible .project-arrow { transform: translate(5px, -5px); color: var(--accent); }

    .experience-layout { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.5fr); gap: clamp(48px, 8vw, 110px); }
    .experience-lead {
      position: static;
      align-self: start;
    }
    .experience-lead h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(54px, 5vw, 70px);
      font-weight: 400;
      line-height: .78;
    }
    .experience-lead p { margin: 25px 0 0; color: var(--muted); font-size: 11px; }
    .timeline { border-top: 1px solid var(--line); }
    .role {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(150px, .8fr) minmax(230px, 1.2fr) 34px;
      gap: 28px;
      align-items: start;
      padding: 28px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .role-company { font-family: var(--display); font-size: 31px; line-height: .9; }
    .role-copy { color: var(--muted); font-size: 12px; }
    .role-copy b { display: block; margin-bottom: 8px; color: var(--ink); font-weight: 500; }
    .role-arrow { text-align: right; transition: transform .15s ease; }
    .role:hover, .role:focus-visible { color: var(--accent); outline: none; }
    .role:hover .role-copy { color: var(--ink); }
    .role:hover .role-arrow, .role:focus-visible .role-arrow { transform: translateX(5px); }

    .facts {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: clamp(55px, 11vw, 170px);
    }
    .fact-block h3 { margin: 0 0 28px; font-size: 11px; font-weight: 500; color: var(--accent); }
    .education { font-family: var(--display); font-size: clamp(34px, 5vw, 62px); line-height: .9; }
    .education small { display: block; margin-top: 20px; color: var(--muted); font-family: var(--mono); font-size: 11px; line-height: 1.5; }
    .stack { margin: 0; border-top: 1px solid var(--line); }
    .stack-row { display: grid; grid-template-columns: 115px 1fr; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .stack-row dt { color: var(--muted); }
    .stack-row dd { margin: 0; }

    .contact { min-height: 70svh; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 0 26px; }
    .contact-label { color: var(--muted); font-size: 11px; }
    .contact-link {
      width: fit-content;
      max-width: 100%;
      margin: auto 0 0;
      color: var(--ink);
      font-family: var(--display);
      font-size: clamp(44px, 9vw, 124px);
      line-height: .82;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .contact-link:hover, .contact-link:focus-visible { color: var(--accent); outline: none; }
    .footnote { display: flex; justify-content: space-between; gap: 20px; padding-top: 45px; color: var(--muted); font-size: 12px; }

    dialog {
      width: min(980px, calc(100% - 36px));
      max-height: min(780px, calc(100dvh - 36px));
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
      box-shadow: 10px 10px 0 var(--accent);
      opacity: 0;
      transform: translateY(18px) scale(.985);
      transition: opacity .2s ease, transform .24s cubic-bezier(.22, .8, .3, 1);
    }
    dialog.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    dialog.is-closing { pointer-events: none; }
    dialog::backdrop { background: rgba(4, 3, 6, 0); transition: background-color .2s ease; }
    dialog.is-visible::backdrop { background: rgba(4, 3, 6, .82); }
    .panel-visual,
    .panel-content {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .18s ease .06s, transform .24s cubic-bezier(.22, .8, .3, 1) .06s;
    }
    dialog.is-visible .panel-visual,
    dialog.is-visible .panel-content { opacity: 1; transform: translateY(0); }
    body.panel-returning .project:focus,
    body.panel-returning .role:focus {
      background: transparent;
      color: var(--ink);
      outline: none;
      transition: none;
    }
    body.panel-returning .project:focus .project-proof,
    body.panel-returning .role:focus .role-copy { color: var(--muted); }
    .panel-shell { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: inherit; }
    .panel-top { min-height: 52px; display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
    .panel-code { font-size: 10px; color: var(--muted); }
    .panel-close { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; font-family: var(--display); font-size: 22px; }
    .panel-close:hover, .panel-close:focus-visible { background: var(--accent); color: #fff; outline: none; }
    .panel-body { display: grid; grid-template-columns: minmax(215px, .65fr) minmax(0, 1.35fr); min-height: 0; overflow: auto; }
    .panel-visual { min-height: 470px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); background: var(--bg); }
    .panel-glyph { width: 82px; height: 82px; display: grid; place-items: center; border: 1px solid var(--ink); box-shadow: 6px 6px 0 var(--accent); font-family: var(--display); font-size: 44px; color: var(--accent); }
    .panel-visual-label { margin-top: auto; color: var(--muted); font-size: 10px; }

    .panel-details p { margin: 0; font-size: 12px; }

    .panel-tag { padding: 4px 7px; border: 1px solid var(--line); font-size: 10px; }
    .panel-link { display: inline-block; margin-top: 32px; padding-bottom: 3px; border-bottom: 1px solid var(--ink); text-decoration: none; font-size: 11px; }
    .panel-link[hidden] { display: none; }

    @media (max-width: 800px) {

    /* 2026 editorial revamp */
    :root {
      --bg: #000008;
      --bg-rgb: 0, 0, 8;
      --ink: #f1ead9;
      --muted: #b9b4aa;
      --line: rgba(206, 166, 80, .5);
      --accent: #cea650;
      --accent-soft: rgba(206, 166, 80, .15);
      --green: #91a99a;
      --surface: #000020;
      --surface-2: #000038;
      --cloud-base: 0, 0, 8;
      --cloud-peak: 0, 0, 112;
      --section-fill: rgba(0, 0, 32, .94);
      --section-inset: rgba(206, 166, 80, .08);
      --motif: rgba(206, 166, 80, .14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000008;
        --bg-rgb: 0, 0, 8;
        --ink: #f4eddd;
        --muted: #beb9af;
        --line: rgba(218, 181, 95, .52);
        --accent: #dab55f;
        --accent-soft: rgba(218, 181, 95, .15);
        --green: #94aa9d;
        --surface: #000020;
        --surface-2: #000038;
        --cloud-base: 0, 0, 8;
        --cloud-peak: 0, 0, 128;
        --section-fill: rgba(0, 0, 32, .96);
        --section-inset: rgba(218, 181, 95, .08);
        --motif: rgba(218, 181, 95, .14);
      }
    }

    body {
      font-size: 15px;
      letter-spacing: .01em;
    }

    .atmosphere {
      background: linear-gradient(to bottom, rgba(var(--bg-rgb), .04), transparent 18% 72%, rgba(var(--bg-rgb), .62));
    }

    .shell {
      width: min(1300px, calc(100% - 64px));
      border-inline: 1px solid color-mix(in srgb, var(--line) 42%, transparent);
    }

    .hero {
      min-height: 100svh;
      padding: 22px 28px 26px;
      overflow: hidden;
    }

    .hero-top {
      grid-template-columns: minmax(300px, 1.25fr) minmax(140px, .55fr) minmax(340px, 1fr);
      gap: 32px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .hero-intro {
      max-width: 520px;
      line-height: 1.5;
    }

    .hero-intro strong {
      font-family: var(--display);
      font-size: 17px;
      letter-spacing: .025em;
    }

    .hero-meta {
      padding-left: 14px;
      border-left: 3px solid var(--accent);
      line-height: 1.65;
    }

    .hero-links {
      gap: 10px 24px;
      font-size: 12px;
    }

    .hero-links a {
      padding-bottom: 2px;
    }

    .hero-name {
      margin-top: auto;
      padding-top: clamp(70px, 16vh, 180px);
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 21px 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .hero-kicker::before {
      content: '';
      width: 44px;
      height: 3px;
      background: var(--accent);
    }

    .hero h1 {
      margin-bottom: -.03em;
      font-size: clamp(96px, 19.5vw, 290px);
      line-height: .69;
      letter-spacing: -.02em;
      /* 3D block-letter bevel: hard pixel steps only, zero blur radius */
      text-shadow:
        0 -2px 0 rgba(255, 255, 255, .55),
        -2px 0 0 rgba(255, 255, 255, .25),
        3px 3px 0 #5a5a62,
        6px 6px 0 #3d3d44,
        9px 9px 0 #26262c,
        12px 12px 0 rgba(12, 13, 18, .9);
    }

    .hero h1 span {
      margin-left: .32em;
      margin-top: .055em; /* clear RYAN's drop shadow so the R and Y sides show */
      /* gold bevel: warm highlight, stepped bronze sides, zero blur */
      text-shadow:
        0 -2px 0 rgba(255, 232, 170, .6),
        -2px 0 0 rgba(255, 232, 170, .28),
        3px 3px 0 #8a6a2c,
        6px 6px 0 #6b4f1e,
        9px 9px 0 #4a3512,
        12px 12px 0 rgba(26, 17, 5, .9);
    }

    .hero-spec {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin-top: 32px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .hero-spec span {
      padding: 13px 18px 13px 0;
      color: var(--ink);
      font-size: 11px;
    }

    .hero-spec span + span {
      padding-left: 18px;
      border-left: 1px solid var(--line);
    }

    .hero-spec b {
      margin-right: 14px;
      color: var(--accent);
      font-weight: 600;
    }

    .scroll-mark {
      bottom: 176px;
      right: 28px;
      color: var(--ink);
      letter-spacing: .08em;
    }

    .content-section {
      position: relative;
      padding: 128px 28px 144px;
    }

    .section-head {
      margin-bottom: 58px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .section-head h2,
    .experience-lead h2 {
      letter-spacing: -.025em;
    }

    .section-head span {
      max-width: 190px;
      color: var(--ink);
      text-align: right;
      line-height: 1.45;
    }

    .project-grid {
      border-top: 0;
    }

    .project {
      min-height: 350px;
      padding: 27px 30px 26px;
      border-top: 1px solid var(--line);
      overflow: hidden;
      isolation: isolate;
      transition: background-color .18s ease, color .18s ease;
    }

    .project:nth-child(1),
    .project:nth-child(4) { grid-column: span 7; }

    .project:nth-child(2),
    .project:nth-child(3) { grid-column: span 5; }

    .project:nth-child(odd) { border-right: 1px solid var(--line); }
    .project:nth-child(even) { padding-left: 30px; }

    .project::after {
      content: '';
      position: absolute;
      inset: auto 0 0;
      height: 5px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .24s ease;
    }

    .project-index {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: .08em;
    }

    .project-index::after {
      content: '';
      width: 34px;
      height: 1px;
      background: currentColor;
      opacity: .65;
    }

    .project-title {
      max-width: 620px;
      margin: 38px 0;
      font-size: clamp(48px, 5.4vw, 78px);
      letter-spacing: -.02em;
    }

    .project-proof {
      max-width: 460px;
      font-size: 13px;
      line-height: 1.5;
    }

    .project:hover,
    .project:focus-visible {
      background: var(--ink);
      color: var(--bg);
    }

    .project:hover .project-index,
    .project:focus-visible .project-index,
    .project:hover .project-arrow,
    .project:focus-visible .project-arrow { color: var(--accent); }

    .project:hover .project-proof,
    .project:focus-visible .project-proof { color: var(--bg); }

    .project:hover::after,
    .project:focus-visible::after { transform: scaleX(1); }

    .experience-layout {
      grid-template-columns: minmax(270px, .78fr) minmax(0, 1.52fr);
      gap: clamp(58px, 9vw, 138px);
    }

    .experience-lead {
      top: 48px;
    }


    .role {
      position: relative;
      grid-template-columns: minmax(165px, .78fr) minmax(260px, 1.2fr) 32px;
      padding: 31px 12px 31px 0;
      transition: padding .16s ease, background-color .16s ease;
    }

    .role::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform .16s ease;
    }

    .role-company {
      font-size: 34px;
      letter-spacing: -.01em;
    }

    .role-copy {
      font-size: 13px;
      line-height: 1.5;
    }

    .role:hover,
    .role:focus-visible {
      padding-left: 20px;
      background: var(--accent-soft);
      color: var(--ink);
    }

    .role:hover::before,
    .role:focus-visible::before { transform: scaleY(1); }

    .facts {
      display: block;
    }

    .fact-block h3 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      letter-spacing: .08em;
    }

    .fact-block h3::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .education {
      padding: 24px 0 28px;
      border-bottom: 5px solid var(--accent);
      font-size: clamp(42px, 5vw, 68px);
    }

    .education small {
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    .stack-row {
      grid-template-columns: 120px 1fr;
      gap: 28px;
      padding: 17px 0;
      font-size: 13px;
    }

    .stack-row dt { color: var(--accent); }

    .contact {
      min-height: 78svh;
      position: relative;
      padding: 104px 28px 26px;
    }

    .contact-label {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink);
      letter-spacing: .08em;
    }

    .contact-label::before {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--accent);
    }

    .contact-link {
      margin: auto 0;
      font-size: clamp(45px, 8.2vw, 112px);
      letter-spacing: -.035em;
    }

    .contact-link span { display: block; }
    .contact-link span:last-child { margin-left: .7em; color: var(--accent); }

    .footnote {
      border-top: 1px solid var(--line);
      color: var(--ink);
    }

    dialog {
      border: 1px solid var(--ink);
      box-shadow: 12px 12px 0 var(--accent);
    }

    .panel-top {
      border-bottom-color: var(--ink);
    }

    .panel-code {
      color: var(--ink);
      letter-spacing: .08em;
    }

    .panel-visual {
      position: relative;
      overflow: hidden;
    }

    .panel-visual::after {
      content: '';
      position: absolute;
      width: 180px;
      height: 180px;
      right: -68px;
      bottom: -68px;
      border: 1px solid var(--accent);
      transform: rotate(45deg);
    }

    .panel-glyph {
      width: 94px;
      height: 94px;
      background: var(--ink);
      color: var(--bg);
      box-shadow: 7px 7px 0 var(--accent);
      font-size: 42px;
    }

    .panel-kind { letter-spacing: .07em; }

    @media (max-width: 900px) {
      .shell { width: min(100% - 30px, 760px); }
      .hero { padding-inline: 18px; }
      .hero-top { grid-template-columns: 1fr auto; }
      .hero-meta { display: none; }
      .hero h1 { font-size: clamp(80px, 20.8vw, 158px); white-space: normal; }
      .hero h1 span { margin-left: .14em; }

      .project:nth-child(n) { grid-column: span 6; }

    @media (max-width: 620px) {
      .shell { width: calc(100% - 18px); }

      .hero-top { grid-template-columns: 1fr; gap: 20px; padding-top: 11px; }
      .hero-intro { font-size: 12px; }
      .hero-intro strong { font-size: 15px; }
      .hero-links { justify-content: flex-start; max-width: none; gap: 9px 18px; }

      .project-title { margin: 32px 0; font-size: clamp(44px, 14vw, 62px); }
      .project::after { height: 4px; }
      .experience-layout { gap: 45px; }

      dialog { box-shadow: 6px 6px 0 var(--accent); }

    /* Pixel-gothic framing: carved surfaces, hard shadows, and blood-red ornament */
    .content-section {
      background:
        linear-gradient(90deg, var(--accent) 0 4px, transparent 4px calc(100% - 4px), var(--accent) calc(100% - 4px)),
        var(--section-fill);
      box-shadow:
        inset 0 1px 0 var(--line),
        inset 0 -1px 0 var(--line),
        inset 12px 0 0 var(--section-inset),
        inset -12px 0 0 var(--section-inset);
    }

    .content-section::before,
    .content-section::after {
      content: '';
      position: absolute;
      z-index: 1;
      width: 34px;
      height: 18px;
      pointer-events: none;
      background:
        linear-gradient(var(--accent), var(--accent)) 0 0 / 100% 4px no-repeat,
        linear-gradient(var(--accent), var(--accent)) 0 0 / 4px 100% no-repeat,
        linear-gradient(var(--accent), var(--accent)) 8px 8px / 18px 4px no-repeat;
    }

    .content-section::before { left: 13px; top: 13px; }
    .content-section::after { right: 13px; bottom: 13px; transform: rotate(180deg); }

    .section-head {
      position: relative;
      padding: 24px 26px 24px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 7px 7px 0 var(--accent);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    }

    .section-head h2,
    .experience-lead h2 {
      text-shadow: 3px 3px 0 var(--section-inset);
    }

    .experience-lead h2 { font-size: clamp(42px, 3.6vw, 50px); }

    .project-grid { gap: 14px; }

    .project {
      border: 1px solid var(--line) !important;
      background:
        linear-gradient(135deg, var(--motif) 0 10px, transparent 10px),
        var(--surface);
      box-shadow: 5px 5px 0 var(--section-inset);
      clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 0 100%);
    }

    .project::before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 18px;
      right: 18px;
      width: 22px;
      height: 22px;
      border: 1px solid var(--line);
      transform: rotate(45deg);
    }

    .project:hover,
    .project:focus-visible {
      background:
        linear-gradient(135deg, var(--accent) 0 10px, transparent 10px),
        var(--ink);
      box-shadow: 5px 5px 0 var(--accent);
    }

    .experience-lead {
      padding: 30px 28px 34px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 8px 8px 0 var(--accent);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
    }

    .timeline { border-top: 0; }

    .role {
      margin-bottom: 11px;
      padding: 27px 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 4px 4px 0 var(--section-inset);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .role::before { content: none; }

    .role:hover,
    .role:focus-visible {
      background: var(--ink);
      color: var(--bg);
      box-shadow: 5px 5px 0 var(--accent);
      outline: none;
    }

    .role:hover .role-copy,
    .role:focus-visible .role-copy,
    .role:hover .role-copy b,
    .role:focus-visible .role-copy b { color: var(--bg); }

    .role:hover .role-arrow,
    .role:focus-visible .role-arrow { color: var(--accent); }

    dialog {
      border: 0;
      background: var(--surface);
      box-shadow: 14px 14px 0 var(--accent), 0 0 0 1px var(--ink);
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
      transform: translateY(22px) scale(.97);
      transition: opacity .18s steps(4, end), transform .28s cubic-bezier(.16, .84, .32, 1);
    }

    dialog.is-visible { transform: translateY(0) scale(1); }

    dialog::backdrop { background: rgba(1, 4, 12, 0); }

    dialog.is-visible::backdrop { background: rgba(1, 4, 12, .9); }

    .panel-shell {
      margin: 7px;
      border: 1px solid var(--line);
      max-height: min(766px, calc(100dvh - 50px));
    }

    .panel-top {
      min-height: 58px;
      padding: 0 17px;
      background: var(--surface-2);
      box-shadow: inset 0 -4px 0 var(--accent);
    }

    .panel-top::before {
      content: '';
      width: 72px;
      height: 11px;
      margin-right: auto;
      background:
        linear-gradient(var(--accent), var(--accent)) center / 100% 3px no-repeat,
        linear-gradient(45deg, transparent 40%, var(--accent) 41% 59%, transparent 60%) left / 11px 11px no-repeat,
        linear-gradient(45deg, transparent 40%, var(--accent) 41% 59%, transparent 60%) right / 11px 11px no-repeat;
    }

    .panel-close {
      border-color: var(--ink);
      background: var(--surface);
      box-shadow: 3px 3px 0 var(--accent);
    }

    .panel-visual {
      background: var(--bg);
    }

    .panel-visual::before {
      content: '';
      position: absolute;
      inset: 18px;
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .panel-visual::after {
      width: 210px;
      height: 210px;
      border: 4px double var(--accent);
    }

    .panel-glyph {
      position: relative;
      z-index: 1;
      clip-path: polygon(50% 0, 100% 22%, 100% 78%, 50% 100%, 0 78%, 0 22%);
      border: 0;
      box-shadow: none;
      outline: 4px double var(--accent);
      outline-offset: 6px;
    }

    .panel-content {
      position: relative;
      background:
        linear-gradient(var(--motif), var(--motif)) top right / 74px 6px no-repeat,
        var(--surface);
    }

    .panel-content h3 {
      padding-bottom: 20px;
      border-bottom: 4px double var(--accent);
    }

    .panel-details {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding-bottom: 25px;
    }

    .panel-tag {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 2px 2px 0 var(--section-inset);
    }

    .contact {
      margin-top: 14px;
      background:
        linear-gradient(90deg, var(--accent) 0 4px, transparent 4px calc(100% - 4px), var(--accent) calc(100% - 4px)),
        var(--section-fill);
      border-top: 1px solid var(--line);
      box-shadow: inset 12px 0 0 var(--section-inset), inset -12px 0 0 var(--section-inset);
    }

    .contact::before,
    .contact::after {
      content: '';
      position: absolute;
      width: 36px;
      height: 22px;
      pointer-events: none;
      background:
        linear-gradient(var(--accent), var(--accent)) 0 0 / 100% 4px no-repeat,
        linear-gradient(var(--accent), var(--accent)) 0 0 / 4px 100% no-repeat,
        linear-gradient(var(--accent), var(--accent)) 9px 9px / 19px 4px no-repeat;
    }

    .contact::before { left: 14px; top: 14px; }
    .contact::after { right: 14px; bottom: 14px; transform: rotate(180deg); }

    .contact-label {
      width: fit-content;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 4px 4px 0 var(--accent);
    }

    .contact-link {
      position: relative;
      z-index: 1;
      padding: 32px 36px 37px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 9px 9px 0 var(--accent);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      background: var(--ink);
      color: var(--bg);
    }

    .contact-link:hover span:last-child,
    .contact-link:focus-visible span:last-child { color: var(--accent); }

    .footnote { padding-inline: 2px; }

    @media (max-width: 620px) {
      .content-section {
        background:
          linear-gradient(90deg, var(--accent) 0 3px, transparent 3px calc(100% - 3px), var(--accent) calc(100% - 3px)),
          var(--section-fill);
        box-shadow: inset 8px 0 0 var(--section-inset), inset -8px 0 0 var(--section-inset);
      }
      .section-head { min-height: 0; padding: 21px 18px 21px; box-shadow: 5px 5px 0 var(--accent); }
      .section-head::after { display: none; }
      .project-grid { gap: 10px; }
      .project:nth-child(n) { padding: 23px 18px; }
      .experience-lead { padding: 24px 20px 24px; box-shadow: 5px 5px 0 var(--accent); }
      .experience-lead h2 { font-size: clamp(48px, 15vw, 66px); }
      .role { padding: 23px 16px; }
      .role:hover, .role:focus-visible { padding-left: 16px; }
      dialog { box-shadow: 7px 7px 0 var(--accent), 0 0 0 1px var(--ink); }
      .panel-shell { margin: 4px; }
      .panel-top { min-height: 53px; }
      .panel-visual { min-height: 190px; }
      .panel-visual::before { inset: 12px; }
      .panel-glyph { margin: 12px 0 0 12px; }
      .contact {
        background:
          linear-gradient(90deg, var(--accent) 0 3px, transparent 3px calc(100% - 3px), var(--accent) calc(100% - 3px)),
          var(--section-fill);
        box-shadow: inset 8px 0 0 var(--section-inset), inset -8px 0 0 var(--section-inset);
      }
      .contact-link { width: calc(100% - 8px); padding: 24px 18px 28px; box-shadow: 6px 6px 0 var(--accent); }
    }

    /* Simplified geometry: square corners, no corner ornaments, and an open hero. */
    .shell { border-inline: 0; }
    .hero { border-bottom: 0; }

    .section-head,
    .project,
    .experience-lead,
    .role,
    dialog,
    .panel-glyph,
    .contact-link { clip-path: none; }

    .content-section::before,
    .content-section::after,
    .contact::before,
    .contact::after,
    .project::before,
    .panel-visual::after { content: none; }

    .project { background: var(--surface); }
    .project::after { content: none; }
    .project:hover,
    .project:focus-visible { background: var(--ink); }

    /* See-more links use the same heading scale and framed rhythm as the main sections. */
    .contact {
      min-height: auto;
      display: block;
      padding: 128px 28px 26px;
    }

    .contact .section-head {
      margin-bottom: 58px;
    }

    .social-links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .social-link {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 28px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 5px 5px 0 var(--section-inset);
      text-decoration: none;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .social-name {
      font-family: var(--display);
      font-size: clamp(34px, 4vw, 54px);
      line-height: .9;
    }

    .social-foot {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .social-arrow {
      color: var(--ink);
      font-size: 20px;
      transition: transform .15s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      background: var(--ink);
      color: var(--bg);
      box-shadow: 5px 5px 0 var(--accent);
      outline: none;
    }

    .social-link:hover .social-foot,
    .social-link:focus-visible .social-foot,
    .social-link:hover .social-arrow,
    .social-link:focus-visible .social-arrow { color: var(--bg); }

    .social-link:hover .social-arrow,
    .social-link:focus-visible .social-arrow { transform: translate(5px, -5px); }

    .contact .footnote {
      margin-top: 88px;
    }

    /* Let the animated field remain visible between groups; framing stays on the content itself. */
    .content-section,
    .contact {
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .section-head h2,
    .experience-lead h2 {
      font-size: clamp(53px, 5vw, 70px);
    }

    .experience-layout {
      grid-template-columns: minmax(365px, .85fr) minmax(0, 1.45fr);
    }

    @media (max-width: 900px) {
      .experience-layout { grid-template-columns: 1fr; }
      .social-links { grid-template-columns: 1fr; }
      .social-link { min-height: 150px; }
    }

    @media (max-width: 620px) {
      .contact { padding: 82px 13px 22px; }
      .contact .section-head { margin-bottom: 34px; }
      .social-links { gap: 10px; }
      .social-link { min-height: 132px; padding: 23px 18px; }
      .social-name { font-size: clamp(38px, 13vw, 52px); }
      .contact .footnote { margin-top: 68px; }
    }

    /* Block-built CSS icons keep every edge aligned to the pixel grid. */
    .project-arrow,
    .social-arrow,
    .role-arrow {
      display: inline-block;
      position: relative;
      flex: 0 0 auto;
      font-size: 0;
      line-height: 0;
    }

    .project-arrow,
    .social-arrow {
      width: 20px;
      height: 20px;
    }

    .project-arrow::before,
    .social-arrow::before,
    .panel-link::after {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background: currentColor;
      box-shadow:
        4px -4px 0 currentColor,
        8px -8px 0 currentColor,
        12px -12px 0 currentColor;
    }

    .project-arrow::after,
    .social-arrow::after,
    .panel-link::before {
      content: '';
      display: block;
      width: 12px;
      height: 12px;
      border-top: 4px solid currentColor;
      border-right: 4px solid currentColor;
    }

    .project-arrow::before,
    .social-arrow::before {
      position: absolute;
      left: 2px;
      top: 14px;
    }

    .project-arrow::after,
    .social-arrow::after {
      position: absolute;
      right: 2px;
      top: 2px;
    }

    .role-arrow {
      width: 24px;
      height: 20px;
    }

    .role-arrow::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 20px;
      height: 4px;
      background: currentColor;
    }

    .role-arrow::after {
      content: '';
      position: absolute;
      right: 0;
      top: 8px;
      width: 4px;
      height: 4px;
      background: currentColor;
      box-shadow:
        -4px -4px 0 currentColor,
        -4px 4px 0 currentColor,
        -8px -8px 0 currentColor,
        -8px 8px 0 currentColor;
    }

    /* Keep the pop-out frame quiet: one crisp outline, with no nested border or offset frame. */
    dialog {
      border: 1px solid var(--accent);
      box-shadow: none;
    }

    .panel-shell {
      margin: 0;
      border: 0;
      max-height: min(780px, calc(100dvh - 36px));
    }

    .panel-top {
      border-bottom: 1px solid var(--line);
      box-shadow: none;
    }

    .panel-visual::before,
    .panel-visual::after {
      content: none;
      display: none;
    }

    .panel-top::before { content: none; }

    .panel-close::before {
      content: '';
      width: 4px;
      height: 4px;
      background: currentColor;
      box-shadow:
        4px 4px 0 currentColor,
        8px 8px 0 currentColor,
        12px 12px 0 currentColor,
        12px 0 0 currentColor,
        8px 4px 0 currentColor,
        4px 8px 0 currentColor,
        0 12px 0 currentColor;
      transform: translate(-6px, -6px);
    }

    .company-pixel-x {
      display: inline-block;
      width: 4px;
      height: 4px;
      margin: 0 4px 3px;
      background: currentColor;
      box-shadow:
        4px 4px 0 currentColor,
        8px 8px 0 currentColor,
        8px 0 0 currentColor,
        4px 4px 0 currentColor,
        0 8px 0 currentColor;
    }

    .panel-link {
      position: relative;
      padding-right: 30px;
    }

    .panel-link::before { content: none; }

    .panel-link::after {
      content: '';
      display: block;
      position: absolute;
      right: 1px;
      top: 50%;
      width: 4px;
      height: 4px;
      border: 0;
      background: currentColor;
      box-shadow:
        -4px 0 0 currentColor,
        -8px 0 0 currentColor,
        0 4px 0 currentColor,
        0 8px 0 currentColor,
        -4px 4px 0 currentColor,
        -8px 8px 0 currentColor,
        -12px 12px 0 currentColor;
      transform: translateY(-8px);
    }

    /* Experience now follows the same framed card system as work and see-more. */
    .experience-layout {
      display: block;
    }

    .experience-lead {
      position: relative;
      top: auto;
      width: 100%;
      margin-bottom: 58px;
      padding: 24px 26px 24px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 7px 7px 0 var(--accent);
    }

    .experience-lead h2 {
      font-size: clamp(53px, 5vw, 70px);
    }

    .timeline {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      border: 0;
    }

    .role {
      grid-column: 1 / -1;
      min-height: 190px;
      margin: 0;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 42px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 5px 5px 0 var(--section-inset);
      text-align: left;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .role-top,
    .role-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .role-company {
      max-width: calc(100% - 44px);
      font-size: clamp(34px, 4vw, 54px);
      line-height: .9;
    }

    .role-copy {
      display: grid;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .role-meta {
      color: var(--ink);
      font-size: 11px;
    }

    .role-meta b {
      margin: 0;
      color: inherit;
      font-weight: 500;
    }

    .role-meta > span {
      flex: 0 0 auto;
      color: var(--accent);
    }

    .role-description {
      max-width: 440px;
    }

    .role:hover,
    .role:focus-visible {
      padding: 26px 28px;
      background: var(--ink);
      color: var(--bg);
      box-shadow: 5px 5px 0 var(--accent);
      outline: none;
    }

    .role:hover .role-copy,
    .role:focus-visible .role-copy,
    .role:hover .role-meta,
    .role:focus-visible .role-meta,
    .role:hover .role-meta b,
    .role:focus-visible .role-meta b {
      color: var(--bg);
    }

    .role:hover .role-meta > span,
    .role:focus-visible .role-meta > span,
    .role:hover .role-arrow,
    .role:focus-visible .role-arrow {
      color: var(--accent);
    }

    @media (max-width: 620px) {
      .experience-lead {
        min-height: 0;
        margin-bottom: 34px;
        padding: 21px 18px 21px;
        box-shadow: 5px 5px 0 var(--accent);
      }
      .experience-lead h2 { font-size: clamp(48px, 14.5vw, 66px); }
      .timeline { gap: 10px; }
      .role,
      .role:nth-child(n + 3) {
        grid-column: 1 / -1;
        min-height: 190px;
        padding: 23px 18px;
        gap: 32px;
      }
      .role:hover,
      .role:focus-visible { padding: 23px 18px; }
      .role-company { font-size: clamp(38px, 13vw, 52px); }
      .role-meta { gap: 14px; }
    }

    .footnote { border-top: 0; }

    /* Etched glass: clearer panes with deeper recessed pixel lettering. */
    :root {
      --translucent-gray: rgba(222, 224, 230, .045);
      --glass-bright: rgba(247, 249, 255, .085);
      --glass-mid: rgba(205, 210, 222, .038);
      --glass-deep: rgba(112, 121, 142, .02);
      --glass-edge: rgba(250, 251, 255, .3);
      --glass-depth: rgba(0, 0, 8, .92);
      --etch-light: rgba(255, 255, 255, .46);
      --etch-dark: rgba(0, 0, 8, 1);
    }

    .section-head,
    .experience-lead,
    .project,
    .role,
    .social-link,
    .panel-top {
      background:
        linear-gradient(112deg, var(--glass-bright) 0%, var(--glass-mid) 34%, var(--glass-deep) 68%, rgba(244, 247, 255, .13) 100%),
        var(--translucent-gray);
      border-color: color-mix(in srgb, var(--glass-edge) 74%, var(--accent));
      -webkit-backdrop-filter: blur(8px) saturate(118%);
      backdrop-filter: blur(8px) saturate(118%);
      box-shadow:
        inset 2px 2px 0 color-mix(in srgb, var(--glass-edge) 82%, transparent),
        inset -2px -2px 0 var(--glass-depth),
        inset 0 0 24px rgba(255, 255, 255, .018),
        5px 5px 0 var(--section-inset);
    }

    .section-head,
    .experience-lead {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .26),
        inset 3px 3px 0 color-mix(in srgb, var(--glass-edge) 88%, transparent),
        inset 6px 6px 10px rgba(255, 255, 255, .06),
        inset -3px -3px 0 var(--glass-depth),
        inset -9px -9px 14px rgba(0, 0, 8, .5),
        inset 0 0 32px rgba(255, 255, 255, .028);
    }

    .section-head h2,
    .experience-lead h2,
    .project-title,
    .role-company,
    .social-name {
      color: color-mix(in srgb, var(--ink) 82%, transparent);
      text-shadow:
        -3px -3px 0 var(--etch-dark),
        -2px -2px 0 var(--etch-dark),
        -1px -1px 0 color-mix(in srgb, var(--etch-dark) 84%, transparent),
        1px 1px 0 var(--etch-light),
        2px 2px 0 color-mix(in srgb, var(--etch-light) 76%, transparent),
        0 0 2px color-mix(in srgb, var(--accent) 64%, transparent);
    }

    .project:hover .project-title,
    .project:focus-visible .project-title,
    .role:hover .role-company,
    .role:focus-visible .role-company,
    .social-link:hover .social-name,
    .social-link:focus-visible .social-name {
      color: var(--bg);
      text-shadow:
        -1px -1px 0 rgba(255, 255, 255, .68),
        1px 1px 0 rgba(0, 0, 8, .16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --translucent-gray: rgba(226, 228, 234, .05);
        --glass-bright: rgba(247, 249, 255, .09);
        --glass-mid: rgba(205, 210, 222, .042);
        --glass-deep: rgba(112, 121, 142, .024);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    @media print {
      #pixel-field, .atmosphere, dialog { display: none !important; }
      body { background: #fff; color: #111; }
      .hero { min-height: 600px; }
      .content-section { padding: 55px 0; }
    }

    /* No gold framing: the glass inset highlight carries every frame. */
    .section-head,
    .experience-lead,
    .project,
    .role,
    .social-link,
    .panel-top {
      border-color: var(--glass-edge);
    }

    .section-head,
    .experience-lead {
      box-shadow:
        inset 2px 2px 0 color-mix(in srgb, var(--glass-edge) 88%, transparent),
        inset -2px -2px 0 var(--glass-depth),
        inset 0 0 28px rgba(255, 255, 255, .022);
    }

    dialog {
      border: 1px solid var(--glass-edge);
    }

    /* Projects kept an !important gold border and all cards kept a warm
       offset shadow on the bottom/right: both go neutral now. */
    .project {
      border-color: var(--glass-edge) !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .26),
        inset 3px 3px 0 color-mix(in srgb, var(--glass-edge) 88%, transparent),
        inset 6px 6px 10px rgba(255, 255, 255, .06),
        inset -3px -3px 0 var(--glass-depth),
        inset -9px -9px 14px rgba(0, 0, 8, .5),
        inset 0 0 32px rgba(255, 255, 255, .028);
    }

    .role,
    .social-link {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .26),
        inset 3px 3px 0 color-mix(in srgb, var(--glass-edge) 88%, transparent),
        inset 6px 6px 10px rgba(255, 255, 255, .06),
        inset -3px -3px 0 var(--glass-depth),
        inset -9px -9px 14px rgba(0, 0, 8, .5),
        inset 0 0 32px rgba(255, 255, 255, .028);
    }

    /* No outer hairline anywhere: the glass insets alone carry the frame. */
    .section-head,
    .experience-lead,
    .project,
    .role,
    .social-link {
      border: 0 !important;
    }
  </style>
</head>

      var panel = document.getElementById('detailPanel');

      var panelMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      var lastTrigger = null;

      var closingTimer = 0;
      var fields = {
        label: document.getElementById('panelLabel'),
        kind: document.getElementById('panelKind'), title: document.getElementById('panelTitle'), lede: document.getElementById('panelLede'),
        role: document.getElementById('panelRole'), impact: document.getElementById('panelImpact'), tags: document.getElementById('panelTags'),
        link: document.getElementById('panelLink')

      function openEntry(key, trigger) {
        var entry = entries[key];
        if (!entry) return;
        lastTrigger = trigger;
        fields.label.textContent = entry.label;
        fields.kind.textContent = entry.kind;
        fields.title.textContent = entry.title;

        entry.tags.forEach(function (tag) {
          var span = document.createElement('span');

          fields.tags.appendChild(span);
        });
        if (entry.link) {
          fields.link.href = entry.link;
          fields.link.textContent = entry.linkText;
          fields.link.setAttribute('data-cursor', entry.link.indexOf('github.com') !== -1 ? 'View the source' : 'Open the live site');
          fields.link.hidden = false;
        } else {
          fields.link.removeAttribute('href');
          fields.link.removeAttribute('data-cursor');
          fields.link.hidden = true;
        }
        shouldReturnFocus = trigger.matches(':focus-visible');
        document.body.classList.add('panel-open');
        panel.classList.remove('is-visible', 'is-closing');
        panel.showModal();
        if (panelMotion.matches) {
          panel.classList.add('is-visible');
        } else {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { panel.classList.add('is-visible'); });
          });
        }
      }

      function closePanel() {
        if (!panel.open || panel.classList.contains('is-closing')) return;
        if (!shouldReturnFocus) document.body.classList.add('panel-returning');
        panel.classList.add('is-closing');
        panel.classList.remove('is-visible');
        if (panelMotion.matches) {
          panel.close();
        } else {
          closingTimer = window.setTimeout(function () { panel.close(); }, 240);
        }
      }

      document.querySelectorAll('[data-entry]').forEach(function (button) {
        button.addEventListener('click', function () { openEntry(button.getAttribute('data-entry'), button); });
      });
      closeButton.addEventListener('click', closePanel);
      panel.addEventListener('click', function (event) {
        if (event.target === panel) closePanel();
      });
      panel.addEventListener('cancel', function (event) {
        event.preventDefault();
        closePanel();
      });
      panel.addEventListener('close', function () {
        window.clearTimeout(closingTimer);
        panel.classList.remove('is-visible', 'is-closing');
        document.body.classList.remove('panel-open');
        if (lastTrigger && shouldReturnFocus) {
          lastTrigger.focus({ preventScroll: true });
        } else if (lastTrigger) {
          requestAnimationFrame(function () {
            lastTrigger.blur();
            document.body.classList.remove('panel-returning');
          });
        } else {
          document.body.classList.remove('panel-returning');
        }
      });

      var canvas = document.getElementById('pixel-field');
      var ctx = canvas.getContext('2d', { alpha: false });
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      var dark = window.matchMedia('(prefers-color-scheme: dark)');
      var pixelSize = 12;
      var raf = 0;
      var lastFrame = 0;

      function parseRgbToken(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim().split(',').map(function (value) {
          return Number(value.trim());
        });
      }

      function hash(x, y) {
        var value = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return value - Math.floor(value);
      }

      function smoothNoise(x, y) {
        var x0 = Math.floor(x);
        var y0 = Math.floor(y);
        var tx = x - x0;
        var ty = y - y0;
        var sx = tx * tx * (3 - 2 * tx);
        var sy = ty * ty * (3 - 2 * ty);
        var top = hash(x0, y0) * (1 - sx) + hash(x0 + 1, y0) * sx;
        var bottom = hash(x0, y0 + 1) * (1 - sx) + hash(x0 + 1, y0 + 1) * sx;
        return top * (1 - sy) + bottom * sy;
      }

      function cloudValue(u, v, drift) {
        return smoothNoise(u * 3 + drift, v * 3 - drift * .4) * .58 +
          smoothNoise(u * 6 - drift * .7, v * 6 + drift * .25) * .28 +
          smoothNoise(u * 12 + drift * .4, v * 12 - drift * .18) * .14;
      }

      function drawFrame(time) {
        var w = canvas.width;
        var h = canvas.height;
        var drift = reduced.matches ? 0 : time * .00008;
        var base = parseRgbToken('--cloud-base');
        var peak = parseRgbToken('--cloud-peak');
        var image = ctx.createImageData(w, h);
        var data = image.data;
        var offset = 0;

        for (var y = 0; y < h; y += 1) {
          for (var x = 0; x < w; x += 1) {
            var cloud = cloudValue(x / w, y / h, drift);
            var intensity = Math.max(0, Math.min(1, (cloud - .33) * 2.8));
            var band = Math.floor(intensity * 5) / 5;
            var blue = Math.round(base[2] + (peak[2] - base[2]) * band);
            data[offset] = 0;
            data[offset + 1] = 0;
            data[offset + 2] = Math.max(0, Math.min(140, blue));
            data[offset + 3] = 255;
            offset += 4;
          }
        }
        ctx.putImageData(image, 0, 0);
      }

      function animate(time) {
        if (time - lastFrame >= 50) {
          lastFrame = time;
          drawFrame(time);
        }
        if (!reduced.matches) raf = requestAnimationFrame(animate);
      }

      function resizeCanvas() {
        canvas.width = Math.ceil(window.innerWidth / pixelSize);
        canvas.height = Math.ceil(window.innerHeight / pixelSize);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.imageSmoothingEnabled = false;
        drawFrame(0);
      }

      function restartClouds() {
        cancelAnimationFrame(raf);
        lastFrame = 0;
        drawFrame(0);
        if (!reduced.matches) raf = requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resizeCanvas);
      dark.addEventListener('change', restartClouds);
      reduced.addEventListener('change', restartClouds);
      resizeCanvas();
      restartClouds();
    }());
